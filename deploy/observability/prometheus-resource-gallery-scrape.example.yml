# Merge this job into the production Prometheus configuration. The referenced
# token file must contain only RESOURCE_GALLERY_SYNC_TOKEN and have mode 0600.
scrape_configs:
  - job_name: resource-gallery-sync
    scheme: https
    metrics_path: /api/sync/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/resource-gallery-sync-token
    static_configs:
      - targets:
          - gallery.example.com
