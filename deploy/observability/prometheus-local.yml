global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/resource-gallery-sync.yml

scrape_configs:
  - job_name: resource-gallery-sync
    metrics_path: /api/sync/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/resource-gallery-sync-token
    static_configs:
      - targets:
          - api:8787
