name: resource-gallery

services:
  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/resource-gallery-sync-alerts.example.yml:/etc/prometheus/rules/resource-gallery-sync.yml:ro
      - ${RESOURCE_GALLERY_PROMETHEUS_SECRET_DIR:?set a local Prometheus secret directory}:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:
