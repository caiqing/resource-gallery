name: resource-gallery

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "8787"
      DATABASE_PATH: ./data/gallery.db
      BLOB_ROOT: ./data/blobs
      UPLOAD_ROOT: ./data/uploads
      SEED_USERS: "false"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?set DOWNLOAD_SIGNING_SECRET in deploy/.env}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      MAX_PACKAGE_BYTES: ${MAX_PACKAGE_BYTES:-536870912}
      MAX_UNCOMPRESSED_PACKAGE_BYTES: ${MAX_UNCOMPRESSED_PACKAGE_BYTES:-805306368}
      MAX_AUDIO_OVERVIEW_BYTES: ${MAX_AUDIO_OVERVIEW_BYTES:-67108864}
      MAX_VIDEO_OVERVIEW_BYTES: ${MAX_VIDEO_OVERVIEW_BYTES:-134217728}
      MAX_PREVIEW_BYTES: ${MAX_PREVIEW_BYTES:-10485760}
      BLOB_STORAGE_BACKEND: ${BLOB_STORAGE_BACKEND:-filesystem}
      BLOB_S3_BUCKET: ${BLOB_S3_BUCKET:-}
      BLOB_S3_REGION: ${BLOB_S3_REGION:-us-east-1}
      BLOB_S3_ENDPOINT: ${BLOB_S3_ENDPOINT:-}
      BLOB_S3_PREFIX: ${BLOB_S3_PREFIX:-resource-gallery}
      BLOB_S3_FORCE_PATH_STYLE: ${BLOB_S3_FORCE_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RESOURCE_GALLERY_SYNC_ENABLED: ${RESOURCE_GALLERY_SYNC_ENABLED:-false}
      RESOURCE_GALLERY_SYNC_TOKEN: ${RESOURCE_GALLERY_SYNC_TOKEN:-}
      RESOURCE_GALLERY_SYNC_ACTOR_EMAIL: ${RESOURCE_GALLERY_SYNC_ACTOR_EMAIL:-}
      RESOURCE_GALLERY_SYNC_MAX_REMOVED_FILES: ${RESOURCE_GALLERY_SYNC_MAX_REMOVED_FILES:-0}
      RESOURCE_GALLERY_SYNC_MAX_ATTEMPTS: ${RESOURCE_GALLERY_SYNC_MAX_ATTEMPTS:-3}
      SEED_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?set INITIAL_ADMIN_EMAIL in deploy/.env}
      SEED_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in deploy/.env}
    volumes:
      - gallery-data:/app/services/api/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gallery-data:
  caddy-data:
  caddy-config:
